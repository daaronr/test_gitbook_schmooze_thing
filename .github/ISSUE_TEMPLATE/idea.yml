name: Idea or request
description: Suggest a feature, change, or improvement.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Ideas of any size are welcome — from a wording tweak to a whole new capability.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature or change in your own words.
      placeholder: Notify me when a specific person becomes available.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
      description: What are you trying to do, and what makes it hard today?
      placeholder: I miss people's windows because I have to keep the page open.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would use it often
        - Blocking me from using the app
    validations:
      required: false
