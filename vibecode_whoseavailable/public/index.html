<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="See who's available for a chat, right now.">
  <title>Who's Available</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Available">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- Minimal top bar -->
  <header>
    <div class="header-inner">
      <h1>Who's Available</h1>
      <div class="header-actions">
        <button id="settingsToggle" class="icon-btn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="3"/><path d="M10 1v2m0 14v2m-9-9h2m14 0h2m-3.3-5.3-1.4 1.4m-8.6 8.6-1.4 1.4m0-11.4 1.4 1.4m8.6 8.6 1.4 1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>

    <!-- Setup panel (collapsible, remembers state) -->
    <section id="setupPanel" class="panel setup-panel hidden">
      <div class="setup-grid">
        <div>
          <label for="name">Your name</label>
          <input id="name" type="text" placeholder="Your name" autocomplete="name">
        </div>
        <div>
          <label for="room">Group</label>
          <input id="room" type="text" placeholder="main" value="main">
        </div>
      </div>

      <!-- Contact methods -->
      <details class="setup-details">
        <summary>Contact methods</summary>
        <div id="contactMethodsContainer"></div>
        <button id="addContactMethod" class="link-btn">+ Add method</button>
        <label class="check-label">
          <input type="checkbox" id="saveContactMethods"> Remember these
        </label>
      </details>

      <div class="setup-actions">
        <button id="shareBtn" class="secondary-btn">Copy invite link</button>
        <button id="darkModeToggle" class="secondary-btn" title="Toggle dark mode">Dark mode</button>
      </div>
    </section>

    <!-- Status banner (shows when you're available) -->
    <div id="statusBanner" class="status-banner hidden">
      <div class="status-text">
        <span id="statusMessage">You're available</span>
        <span id="statusTimer" class="status-timer"></span>
      </div>
      <div class="status-actions">
        <button id="extendBtn" class="pill-btn">+10 min</button>
        <button id="doneBtn" class="pill-btn done-btn">Done</button>
      </div>
    </div>

    <!-- Quick-tap availability (the hero) -->
    <section id="availabilitySection" class="panel">
      <div id="quickTaps" class="quick-taps">
        <!-- Rendered by JS from config -->
      </div>

      <!-- Duration override (small, tucked under) -->
      <div class="duration-row">
        <span class="duration-label">Duration:</span>
        <div class="duration-pills">
          <button type="button" class="dur-pill" data-min="5">5m</button>
          <button type="button" class="dur-pill active" data-min="15">15m</button>
          <button type="button" class="dur-pill" data-min="30">30m</button>
          <button type="button" class="dur-pill" data-min="60">1h</button>
        </div>
      </div>
    </section>

    <!-- Roster: who's available now -->
    <section class="panel">
      <div class="panel-header">
        <h2>Available now</h2>
        <span id="rosterCount" class="count-badge">0</span>
      </div>
      <div id="list"></div>
    </section>

    <!-- Topics & Audio (collapsed) -->
    <details class="panel topics-panel">
      <summary class="panel-header clickable">
        <h2>Topics & Audio</h2>
        <span id="topicCount" class="count-badge">0</span>
      </summary>

      <div class="topics-content">
        <!-- Create Topic -->
        <div class="topic-form">
          <input id="topicTitle" type="text" placeholder="New discussion topic...">
          <details class="topic-extras">
            <summary class="link-btn">More options</summary>
            <textarea id="topicPrompt" placeholder="Add context..."></textarea>
            <div class="topic-options-row">
              <input id="topicDue" type="datetime-local" placeholder="Due date">
              <div class="inline-field">
                <label for="topicMax">Max</label>
                <input id="topicMax" type="number" min="1" max="10" value="2" class="slim-input">
                <span class="muted">min</span>
              </div>
            </div>
          </details>
          <button id="newTopicBtn" class="primary-btn full-width">Create topic</button>
        </div>

        <!-- Record Response -->
        <div class="record-section">
          <div class="record-row">
            <select id="responseTopic" class="topic-select"></select>
          </div>
          <div class="record-controls">
            <button id="recordBtn" class="record-btn">Record</button>
            <button id="stopBtn" class="secondary-btn" disabled>Stop</button>
            <label class="file-label">
              <input id="fileInput" type="file" accept="audio/*">
              Upload
            </label>
            <button id="submitResponseBtn" class="primary-btn" disabled>Submit</button>
          </div>
          <span class="muted small" id="recordStatus"></span>
          <audio id="preview" controls class="audio-preview"></audio>
        </div>

        <!-- Topics List -->
        <div id="topicsList"></div>
      </div>
    </details>

  </main>

  <footer>
    <p class="muted small">
      <a href="https://davidreinstein.org" target="_blank">David Reinstein</a> &middot;
      Data persists across restarts
    </p>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW failed:', err));
    }
  </script>
</body>
</html>
